name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: true
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        browser: [chrome, edge, safari]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: true
      - run: pnpm build:${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        with:
          name: tab-workspace-${{ matrix.browser }}
          path: build/${{ matrix.browser }}
          retention-days: 30
