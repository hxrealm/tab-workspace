name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, edge, safari]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
          run_install: true
      - run: pnpm build:${{ matrix.browser }}
      - run: |
          cd build/${{ matrix.browser }}
          zip -r ../tab-workspace-${{ matrix.browser }}.zip .
      - name: Pack Chrome CRX
        if: matrix.browser == 'chrome'
        run: |
          pip install cryptography
          python3 << 'PYEOF'
          import zipfile, struct, hashlib, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa, padding
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.backends import default_backend

          private_key = rsa.generate_private_key(
              public_exponent=65537, key_size=2048, backend=default_backend()
          )
          zip_path = 'build/tab-workspace-chrome.zip'
          with open(zip_path, 'rb') as f:
              zip_data = f.read()

          pub_key_der = private_key.public_key().public_bytes(
              serialization.Encoding.DER,
              serialization.PublicFormat.SubjectPublicKeyInfo
          )
          sha256 = hashlib.sha256(zip_data).digest()

          crx_path = 'build/tab-workspace-chrome.crx'
          with open(crx_path, 'wb') as f:
              f.write(b'Cr24')
              f.write(struct.pack('<I', 3))
              f.write(struct.pack('<I', 1))
              f.write(struct.pack('<I', len(pub_key_der)))
              f.write(struct.pack('<I', len(sha256)))
              f.write(pub_key_der)
              f.write(sha256)
              f.write(zip_data)

          print(f'Created {crx_path} ({os.path.getsize(crx_path)} bytes)')
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: tab-workspace-${{ matrix.browser }}
          path: build/tab-workspace-${{ matrix.browser }}.zip
      - name: Upload Chrome CRX
        if: matrix.browser == 'chrome'
        uses: actions/upload-artifact@v4
        with:
          name: tab-workspace-chrome-crx
          path: build/tab-workspace-chrome.crx

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
