name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, edge, safari]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm build:${{ matrix.browser }}
      - run: |
          cd build/${{ matrix.browser }}
          zip -r ../tab-workspace-${{ matrix.browser }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: tab-workspace-${{ matrix.browser }}
          path: build/tab-workspace-${{ matrix.browser }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
